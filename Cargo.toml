[package]
name = "robotrace-sim"
version = "0.6.0"
edition = "2021"
description = "Configurable Robotrace simulator with independent physics and controller clocks"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.27", optional = true }
rfd = { version = "0.17.2", optional = true }
